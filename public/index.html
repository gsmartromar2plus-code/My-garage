async function saveRecord(id,rid){let work=$('#rw').value.trim(),km=Number($('#rm').value),cost=Number($('#rc').value)||0;if(!work||!$('#rd').value||$('#rm').value===''||!Number.isFinite(km)||km<0||cost<0||['rPartsCost','rLaborCost'].some(id=>+$('#'+id)?.value<0))return alert('Перевір назву, дату, пробіг і вартість');let v=d.vehicles.find(x=>x.id===id),obj={vehicleId:id,vehicleName:v.name,category:$('#rCategory')?.value||'Інше',provider:$('#rProvider')?.value||'',partsCost:$('#rPartsCost')?.value||null,laborCost:$('#rLaborCost')?.value||null,kind:$('#rk').value,work,ruleId:$('#rr').value,date:$('#rd').value,km,cost,parts:$('#rp').value,note:$('#rn').value};let old=d.carRecords.find(x=>x.id===rid),photoFile=$('#rphoto')?.files?.[0];obj.photo=photoFile?await compressPhoto(photoFile,1400,.72):(old?.photo||'');obj.attachments=await readAttachments(old?.attachments||[]);if(old)Object.assign(old,obj);else d.carRecords.push({id:'r'+Date.now(),...obj});if(km>Number(v.km||0))v.km=km;save();detail(id)}function editRecord(id,rid){let r=d.carRecords.find(x=>x.id===rid),v=d.vehicles.find(x=>x.id===id),rules=d.serviceRules.filter(x=>x.vehicleId===id);page('Редагувати запис',esc(v.name),`<div class="card">${recordForm(id,rules,v,r)}<button class="btn2" onclick="detail('${id}')">Назад</button></div>`)}function delRecord(id,rid){if(confirm('Видалити цей запис?')){d.carRecords=d.carRecords.filter(x=>x.id!==rid);save();detail(id)}}

function saveRule(id,rid){let name=$('#sn').value.trim(),km=$('#sk').value===''?0:Number($('#sk').value),months=$('#sm').value===''?0:Number($('#sm').value),alertKm=$('#sa').value===''?0:Number($('#sa').value),alertMonths=$('#sam').value===''?0:Number($('#sam').value);if(!name||(!km&&!months)||![km,months,alertKm,alertMonths].every(Number.isFinite)||km<0||months<0||alertKm<0||alertMonths<0)return alert('Вкажи назву та коректні невід’ємні інтервали');let obj={vehicleId:id,name,kmInterval:km,monthInterval:months,alertKm,alertMonths},r=d.serviceRules.find(x=>x.id===rid);if(r)Object.assign(r,obj);else d.serviceRules.push({id:'s'+Date.now(),...obj});save();detail(id)}

function saveFuelLog(id){let v=d.vehicles.find(x=>x.id===id),date=$('#flDate').value,type=$('#flType').value,km=Number($('#flKm').value),qty=Number($('#flQty').value),price=Number($('#flPrice').value),total=qty*price;if(!v||!date||$('#flKm').value===''||!Number.isFinite(km)||km<0||!(qty>0&&price>0))return alert('Перевір дату, пробіг, кількість і ціну');if(km<Number(v.km||0)&&!confirm('Пробіг заправки менший за поточний. Зберегти як старий запис?'))return;d.fuelups.push({id:'f'+Date.now(),vehicleId:id,date,type,km,qty,price,total,station:$('#flStation')?.value||'',note:$('#flNote')?.value||'',full:$('#flFull').checked});if(km>Number(v.km||0))v.km=km;save();detail(id)}
function fuelConsumption(id){let all=d.fuelups.filter(x=>x.vehicleId===id&&x.km!==''&&x.km!=null&&Number.isFinite(+x.km)).sort((x,y)=>+x.km- +y.km||(x.date||'').localeCompare(y.date||'')),out=[];for(let type of [...new Set(all.map(x=>x.type))]){let previous=null,liters=0,cost=0;for(let x of all.filter(x=>x.type===type)){if(!previous){if(x.full)previous=x;continue}liters+=+x.qty||0;cost+=+x.total||0;if(x.full&&+x.km>+previous.km){let dist=+x.km- +previous.km;if(liters>0)out.push({type,from:+previous.km,to:+x.km,dist,liters,cost,use:liters/dist*100,date:x.date});previous=x;liters=0;cost=0;}}}return out.sort((a,b)=>(a.date||'').localeCompare(b.date||''))}

function fuelupHistory(id){let a=d.fuelups.filter(x=>x.vehicleId===id).sort((x,y)=>(y.date||'').localeCompare(x.date||'')),cons=fuelConsumption(id);return `<div class="card"><div class="head"><b>Заправки та фактична витрата</b><button class="smallbtn" onclick="fuelLogForm('${id}')">＋ Заправка</button></div>${cons.length?cons.slice(-4).reverse().map(x=>`<div class="row"><span><b>${x.use.toFixed(2)} ${x.type==='electric'?'кВт·год':'л'}/100 км</b><small>${num(x.dist)} км · ${num(x.liters)} ${x.type==='electric'?'кВт·год':'л'} · ${fuelLabel(x.type)}</small></span><span class="tiny">${fmtDate(x.date)}</span></div>`).join(''):'<div class="tiny">Для розрахунку фактичної витрати потрібні щонайменше дві заправки до повного бака одного типу пального.</div>'}${a.slice(0,5).map(x=>`<div class="row"><span>${fuelLabel(x.type)} · ${num(x.qty)} ${x.type==='electric'?'кВт·год':'л'}${x.full?' · повний бак':''}<small>${fmtDate(x.date)} · ${num(x.km)} км</small></span><b>${cash(x.total)}</b></div>`).join('')}${a.length?`<button class="btn2" onclick="fuelLogList('${id}')">Усі заправки (${a.length})</button>`:''}</div>`}
function fuelLogList(id){let a=d.fuelups.filter(x=>x.vehicleId===id).sort((x,y)=>(y.date||'').localeCompare(x.date||''));page('Історія заправок','Записи пального',`${a.map(x=>`<div class="row"><span><b>${fuelLabel(x.type)} · ${num(x.qty)} ${x.type==='electric'?'кВт·год':'л'}</b><small>${fmtDate(x.date)} · ${num(x.km)} км · ${x.full?'повний бак':''}</small></span><span><b>${cash(x.total)}</b><button class="smallbtn danger-btn" onclick="deleteFuelLog('${id}','${x.id}')">Видалити</button></span></div>`).join('')||'<div class="empty">Заправок немає.</div>'}<button class="btn2" onclick="detail('${id}')">Назад</button>`)}

function deleteRule(id,rid){if(!confirm('Видалити цей регламент? Історичні записи залишаться, але втратять прив’язку до регламенту.'))return;d.serviceRules=d.serviceRules.filter(x=>x.id!==rid);d.carRecords.forEach(r=>{if(r.ruleId===rid)r.ruleId=''});save();detail(id)}
function deleteVehicle(id){let v=d.vehicles.find(x=>x.id===id);if(!v)return;if(!confirm(`Видалити «${v.name}» разом із регламентами, історією, документами, подіями та бюджетами? Це незворотна дія. Спершу рекомендовано зробити резервну копію.`))return;d.vehicles=d.vehicles.filter(x=>x.id!==id);d.serviceRules=d.serviceRules.filter(x=>x.vehicleId!==id);d.carRecords=d.carRecords.filter(x=>x.vehicleId!==id);d.fuelups=d.fuelups.filter(x=>x.vehicleId!==id);d.documents=d.documents.filter(x=>x.vehicleId!==id);d.breakdowns=d.breakdowns.filter(x=>x.vehicleId!==id);d.events=d.events.filter(x=>x.vehicleId!==id);d.budgets=d.budgets.filter(x=>x.vehicleId!==id);save();home()}
async function decodeVinFromForm(){
 let vin=($('#vvin')?.value||'').trim().toUpperCase();
 if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){alert('VIN має містити рівно 17 символів. Літери I, O та Q не використовуються.');return}
 let btn=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('розшифрувати VIN'));
 if(btn){btn.disabled=true;btn.textContent='Перевіряю VIN…'}
 try{
  let response=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/'+encodeURIComponent(vin)+'?format=json');
  if(!response.ok)throw new Error('Сервіс VIN тимчасово недоступний');
  let data=await response.json(),r=data.Results&&data.Results[0];
  if(!r)throw new Error('Сервіс не повернув результат');
  let parts=[r.ModelYear,r.Make,r.Model,r.Trim,r.EngineModel,r.DisplacementL?`${r.DisplacementL} л`:null,r.FuelTypePrimary].filter(x=>x&&x!=='Not Applicable');
  if(!parts.length)throw new Error('VIN прийнято, але сервіс не зміг визначити характеристики. Перевір VIN або скористайся каталогом виробника.');
  if($('#vy')&&!$('#vy').value)$('#vy').value=r.ModelYear||'';
  if($('#vn')&&(!$('#vn').value||$('#vn').value.length<4))$('#vn').value=[r.Make,r.Model].filter(Boolean).join(' ');
  if($('#ve')&&!$('#ve').value)$('#ve').value=[r.EngineModel,r.DisplacementL?`${r.DisplacementL} л`:null,r.FuelTypePrimary].filter(Boolean).join(' / ');
  alert('Результат VIN:\\n'+parts.join(' · ')+'\\n\\nПеревір дані перед збереженням. Інтервали ТО сервіс VIN не визначає.');
 }catch(e){alert('Не вдалося розшифрувати VIN. '+(e.message||'Перевір підключення до інтернету або спробуй пізніше.'))}
 finally{if(btn){btn.disabled=false;btn.textContent='Спробувати розшифрувати VIN'}}
}

function calcFuel(){

  if($('#fcPetrol').value===''||$('#fcWarmup').value==='')return alert('Вкажіть бензин на рух і запуск/прогрів. Введіть 0, якщо він не витрачається.');

  if(!(gas>0&&gp>0&&pp>0&&Number.isFinite(warm)&&warm>=0&&petrol>=0))return alert('Вкажи витрату й ціну газу, ціну бензину та бензин на прогрів');

  rows=[`Газ: ${gl.toFixed(2)} л · ${cash(gc)}`,`Бензин (прогрів + рух): ${pl.toFixed(2)} л · ${cash(pc)}`];
 }else{
  let use=+$('#fcUse').value,price=+$('#fcPrice').value;
  if(!(use>0&&price>0))return alert('Вкажи витрату та ціну пального');

 }
 $('#fcResult').innerHTML=`<div class="recommend calc-result"><small>ОРІЄНТОВНА ВАРТІСТЬ ПОЇЗДКИ · ${num(dist)} КМ</small><b>${cash(cost)}</b><div>${rows.join('<br>')}</div><div class="tiny">У середньому ${cash(cost/dist*100)} на 100 км · маршрут: ${route==='city'?'місто':route==='highway'?'траса':'змішаний'}</div></div>`;
}
function compareFuel(){

  let type=$('#t'+n).value,price=Number($('#p'+n).value),city=Number($('#u'+n+'c').value),high=Number($('#u'+n+'h').value);
  if(type==='petrol_lpg'){$('#cr').innerHTML='<div class="note">Для автомобіля з ГБО використай основний калькулятор поїздки: він окремо враховує газ, бензин у русі та бензин на запуск і прогрів. Порівняння двох авто поки призначене для одного основного виду пального.</div>';return}

function dueItems(){return d.serviceRules.map(r=>{let v=d.vehicles.find(x=>x.id===r.vehicleId);if(!v)return null;let last=d.carRecords.filter(x=>x.vehicleId===v.id&&x.ruleId===r.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.km-a.km)[0];let km=last&&last.km!==''&&last.km!=null&&Number.isFinite(+last.km)&&r.kmInterval?+last.km + +r.kmInterval - +v.km:null,date=last&&r.monthInterval?monthAdd(last.date,+r.monthInterval):null;let days=date?Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null;let overdue=(km!==null&&km<=0)||(days!==null&&days<0),soon=(km!==null&&km<=Number(r.alertKm??500))||(days!==null&&days<=30);return {r,v,last,km,date,days,overdue,soon}}).filter(Boolean).sort((a,b)=>(b.overdue-a.overdue)||(b.soon-a.soon)||(a.km??Infinity)-(b.km??Infinity))}
function vehicleCard(v,i){let due=dueItems().filter(x=>x.v.id===v.id),next=due.find(x=>x.last),bad=due.some(x=>x.overdue),soon=due.some(x=>x.soon);return `<article class="garage-car" style="--delay:${i*70}ms"><button class="car-cover" onclick="detail('${v.id}')">${v.photo?`<img src="${esc(v.photo)}" alt="${esc(v.name)}">`:carArt}<span class="car-number">${String(i+1).padStart(2,'0')} / MY GARAGE</span><span class="car-type">${esc(fuelLabel(v.fuelType))}</span></button><div class="car-body"><div class="car-title"><div><small>${esc([v.year,v.engine].filter(Boolean).join(' · ')||'Ваш автомобіль')}</small><h3><button onclick="detail('${v.id}')">${esc(v.name)}</button></h3></div><button class="arrow-btn" onclick="detail('${v.id}')" aria-label="Відкрити автомобіль">${icon('arrow')}</button></div><div class="car-mileage"><b>${num(v.km)} <small>км</small></b><span class="license">${esc(v.plate||'Без номера')}</span></div><div class="service-strip"><span class="status ${bad?'bad':soon?'warn':'ok'}"><i></i>${bad?'Потрібне ТО':soon?'ТО наближається':due.length?'Під контролем':'Додайте регламент'}</span><small>${next?`${esc(next.r.name)}${next.km!==null?' · '+num(Math.max(0,next.km))+' км':next.date?' · '+fmtDate(next.date):''}`:'Історія обслуговування →'}</small></div><div class="car-actions"><button onclick="fuelLogForm('${v.id}')">${icon('fuel')}Заправка</button><button onclick="quickAddRecord('${v.id}')">${icon('tool')}Обслуговування</button><button onclick="odometer('${v.id}')">${icon('plus')}Пробіг</button></div></div></article>`}
function monthTotals(){let key=today().slice(0,7),r=d.carRecords.filter(x=>x.date?.startsWith(key)),f=d.fuelups.filter(x=>x.date?.startsWith(key));let fuel=f.reduce((s,x)=>s+(+x.total||0),0),service=r.filter(x=>x.kind!=='Ремонт').reduce((s,x)=>s+(+x.cost||0),0),repair=r.filter(x=>x.kind==='Ремонт').reduce((s,x)=>s+(+x.cost||0),0);return {fuel,service,repair,total:fuel+service+repair}}
function home(){initData();let m=monthTotals(),due=dashboardReminders(),date=new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'});pageStack=[];page('Мій гараж','Ваші автомобілі. Усе під контролем.',`<div class="dashboard-top"><span class="eyebrow">ПАНЕЛЬ КЕРУВАННЯ</span><span>${date}</span></div><div class="dashboard-layout"><section class="fleet-section"><div class="section-heading"><h3>Мої автомобілі <span>${d.vehicles.length}</span></h3><button class="primary-small" onclick="vehicleForm()">${icon('plus')}Додати авто</button></div><div class="fleet-grid">${d.vehicles.map(vehicleCard).join('')||`<article class="garage-car empty-garage"><div class="empty-cover"><span class="car-number">ВАШ НОВИЙ РОЗДІЛ · v8.0</span>${carArt}</div><div class="car-body"><span class="eyebrow">ЗБЕРЕЖІТЬ ІСТОРІЮ СВОГО АВТО</span><h3>Усе починається з вашого гаража</h3><p>Додайте автомобіль або перенесіть записи з v6.<br>Пробіг, витрати та наступне ТО — завжди поруч.</p><button class="btn" onclick="vehicleForm()">${icon('plus')}Додати перший автомобіль</button><button class="muted-link" onclick="backupPage()">Імпортувати резервну копію v6 ${icon('arrow')}</button></div></article>`}</div><div class="quick-section"><div class="section-heading"><h3>Швидкі дії</h3><small>Менше кроків — більше порядку</small></div><div class="quickgrid">${[['fuel','Заправка','Записати пальне',"fuelLogForm()"],['wallet','Витрата','Додати новий запис',"quickAddRecord()"],['tool','Обслуговування','Роботи та запчастини',"servicePage()"],['shield','Ремонт','Поломки та діагностика',"breakdownsPage()"]].map(([ic,t,s,fn])=>`<button class="quick" onclick="${fn}"><span class="quick-icon">${icon(ic)}</span><div><b>${t}</b><small>${s}</small></div><span class="quick-arrow">↗</span></button>`).join('')}</div></div><div class="activity"><div class="section-heading"><h3>Останні записи</h3><button class="muted-link" onclick="searchPage()">Уся історія →</button></div>${[...d.carRecords.map(x=>({...x,title:x.work,total:x.cost})),...d.fuelups.map(x=>({...x,title:'Заправка · '+fuelLabel(x.type)}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).map(x=>`<button class="activity-row" onclick="detail('${x.vehicleId}')"><span class="activity-icon">${icon(x.qty?'fuel':'tool')}</span><span><b>${esc(x.title)}</b><small>${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name)} · ${fmtDate(x.date)}</small></span><strong>${cash(x.total)}</strong></button>`).join('')||'<div class="empty-inline">Тут з’являться заправки, роботи та витрати ваших автомобілів.</div>'}</div></section><aside class="dashboard-aside"><section class="month-panel"><div class="section-heading"><span class="eyebrow">ВИТРАТИ ЗА МІСЯЦЬ</span>${icon('chart')}</div><div class="month-label">${new Date().toLocaleDateString('uk-UA',{month:'long',year:'numeric'})}</div><div class="month-value">${num(m.total)} <span>₴</span></div><div class="expense-track">${[['fuel',m.fuel],['service',m.service],['repair',m.repair]].map(([k,v])=>`<span class="${k}" style="flex:${m.total?v/m.total:1}"></span>`).join('')}</div>${[['Пальне',m.fuel,'fuel'],['Обслуговування та інше',m.service,'service'],['Ремонт',m.repair,'repair']].map(([n,v,k])=>`<div class="expense-row"><span><i class="${k}"></i>${n}</span><b>${cash(v)}</b></div>`).join('')}<button class="panel-link" onclick="navigate('analytics')">Детальна аналітика ${icon('arrow')}</button></section><section class="reminders-panel"><div class="section-heading"><h3>Найближчі події</h3><span class="count">${due.length}</span></div>${due.slice(0,3).map(x=>`<button class="reminder" onclick="${x.action||`detail('${x.v.id}')`}"><span class="reminder-icon">${icon('tool')}</span><div><small>${esc(x.v.name)}</small><b>${esc(x.r.name)}</b><span class="${x.overdue?'danger-text':'warn-text'}">${x.overdue?'Прострочено':x.km!==null?'Через '+num(x.km)+' км':fmtDate(x.date)}</span></div></button>`).join('')||`<div class="reminder-empty">${icon('calendar')}<b>Попереду — спокійні поїздки</b><p>Додайте регламенти ТО та документи, щоб бачити нагадування.</p></div>`}<button class="panel-link" onclick="calendarPage()">Відкрити календар ${icon('arrow')}</button></section><section class="backup-panel">${icon('shield')}<div><b>Історія під захистом</b><p>Зберігайте резервні копії з фото.<br>Імпорт JSON з попередніх версій.</p><button class="muted-link" onclick="backupPage()">Резервне копіювання →</button></div></section><div class="fleet-health"><span>Стан автопарку</span><b>${d.vehicles.length?due.some(x=>x.overdue)?'Потребує уваги':'Під контролем':'Ще немає даних'}<i></i></b></div></aside></div>`);}
function carsPage(){page('Автомобілі','Ваш автопарк та історія кожного автомобіля',`<button class="primary-small" onclick="vehicleForm()">＋ Додати автомобіль</button><div class="fleet-grid cars-grid">${d.vehicles.map(vehicleCard).join('')||'<div class="empty">Додайте свій перший автомобіль або імпортуйте JSON із v6.</div>'}</div>`)}

function morePage(){page('Інструменти','Усе для вашого гаража',`<div class="tools-grid">${[['doc','Документи','Строки дії та вкладення','documentsPage()'],['doc','Блог спільноти','Публічні та приватні дописи','blogPage()'],['calendar','Календар','Планові роботи й нагадування','calendarPage()'],['wallet','Бюджет','Порівняння плану та факту','budgetPage()'],['tool','Журнал поломок','Від симптому до ремонту','breakdownsPage()'],['chart','Вартість володіння','Повна історія витрат','ownershipPage()'],['doc','PDF-звіт','Зберегти та передати історію','reportPage()'],['shield','Резервні копії','Експорт та імпорт v6 / v7','backupPage()'],['more','Налаштування','Тема, вигляд і розмір тексту','interfaceSettings()']].map(([ic,t,s,fn])=>`<button class="quick" onclick="${fn}"><span class="quick-icon">${icon(ic)}</span><div><b>${t}</b><small>${s}</small></div>${icon('arrow')}</button>`).join('')}</div>`)}
function backupPage(){page('Резервне копіювання','JSON містить усі записи, налаштування та фотографії',`<div class="card"><h3>Ваша історія залишається з вами</h3><p class="tiny">Резервна копія містить автомобілі, регламенти, записи, заправки, документи, вкладення та налаштування. Зберігайте її окремо від телефона.</p><button class="btn" onclick="exportData()">Завантажити повну JSON-копію</button><button class="btn2" onclick="$('#restore-json').click()">Імпортувати JSON v6 / v7 / v8</button><input type="file" id="restore-json" accept="application/json,.json" hidden onchange="importData(event)"><button class="btn2" onclick="queueSave();if(!ready)boot()">Повторити хмарне збереження</button><p class="tiny">Ваші дані прив’язані до облікового запису. Для перенесення між пристроями увійдіть тим самим способом або скористайтеся JSON-копією.</p></div>`)}
function exportData(){let payload={...d,version:8,exportedAt:new Date().toISOString(),appearance:Object.fromEntries(['Theme','Density','Accent','Round','Wall','Font','Layout','Nav','CarView','Motion'].map(k=>[k,localStorage.getItem('mg'+k)]))};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-garage-v8-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x||typeof x!=='object'||!Array.isArray(x.vehicles)||!Array.isArray(x.carRecords))throw Error('Потрібні масиви vehicles та carRecords.');for(let k of ['vehicles','carRecords','serviceRules','fuelups','documents','events','breakdowns','budgets']){if(x[k]&&!Array.isArray(x[k]))throw Error('Некоректний розділ '+k);for(let r of x[k]||[])if(!r||typeof r!=='object'||!r.id||!/^[\w-]+$/.test(String(r.id)))throw Error('Некоректний ідентифікатор у '+k);let ids=(x[k]||[]).map(r=>r.id);if(new Set(ids).size!==ids.length)throw Error('Повторні ідентифікатори у '+k)}validateBackup(x);if(!confirm(`Знайдено ${x.vehicles.length} авто та ${x.carRecords.length} записів. Поточні дані буде замінено. Спочатку завантажиться їхня резервна копія. Продовжити?`))return;exportData();d={...x,version:8};initData();if(x.appearance)for(let [k,v] of Object.entries(x.appearance))if(v)localStorage.setItem('mg'+k,String(v));loadAppearance();save();home();toast('Імпортовано. Перевірте статус хмарного збереження.')}catch(err){alert('Імпорт скасовано: '+err.message)}};rd.onerror=()=>alert('Не вдалося прочитати файл');rd.readAsText(f)}
function searchPage(){page('Пошук','Роботи, автомобілі, заправки, документи та примітки',`<div class="search-box">${icon('search')}<input id="global-query" placeholder="Назва роботи, пробіг, дата…" oninput="searchResults(this.value)" autofocus></div><div id="search-results"><div class="empty">Введіть запит для пошуку по всій історії.</div></div>`)}
function searchResults(q){let all=[...d.vehicles.map(x=>({...x,title:x.name,vehicleId:x.id})),...d.carRecords.map(x=>({...x,title:x.work})),...d.fuelups.map(x=>({...x,title:'Заправка '+fuelLabel(x.type)})),...d.documents,...d.breakdowns,...d.events];q=q.toLocaleLowerCase().trim();$('#search-results').innerHTML=q?all.filter(x=>Object.entries(x).filter(([k,v])=>!['photo','attachments'].includes(k)&&typeof v!=='object').map(([,v])=>v).join(' ').toLocaleLowerCase().includes(q)||d.vehicles.find(v=>v.id===x.vehicleId)?.name.toLocaleLowerCase().includes(q)).slice(0,100).map(x=>`<button class="activity-row" onclick="detail('${x.vehicleId}')"><span>${icon('doc')}</span><span><b>${esc(x.title)}</b><small>${fmtDate(x.date)} · ${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name||'')}</small></span>${icon('arrow')}</button>`).join('')||'<div class="empty">Нічого не знайдено. Спробуйте інший запит.</div>':'<div class="empty">Введіть запит.</div>'}
function vehicleSelect(id=''){return `<option value="">Обрати автомобіль</option>${d.vehicles.map(v=>`<option value="${v.id}" ${v.id===id?'selected':''}>${esc(v.name)}</option>`).join('')}`}
const input=(id,value='',type='text')=>`<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>`;
function calendarPage(){let all=[...d.events.map(x=>({...x,source:'event'})),...d.documents.filter(x=>x.expiryDate).map(x=>({...x,date:x.expiryDate,source:'document'})),...dueItems().filter(x=>x.date||x.km!==null).map(x=>({id:x.r.id,title:x.r.name,vehicleId:x.v.id,date:x.date,km:x.km!==null?+x.v.km+x.km:null,source:'service',left:x.km}))];all=all.map(x=>({...x,left:x.left??(x.km!=null&&x.vehicleId?+x.km-(+d.vehicles.find(v=>v.id===x.vehicleId)?.km||0):null)}));all.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));page('Календар','ТО, документи та майбутні роботи за датою і пробігом',`<button class="btn" onclick="eventForm()">＋ Запланувати подію</button>${['Прострочені','Найближчі','Майбутні'].map((label,i)=>{let rows=all.filter(x=>{let late=(x.date&&x.date<today())||(x.left!=null&&x.left<=0),soon=(x.date&&x.date<=monthAdd(today(),1))||(x.left!=null&&x.left<=500);return i===0?late:i===1?!late&&soon:!late&&!soon});return `<div class="card"><h3>${label} <span class="count">${rows.length}</span></h3>${rows.map(x=>`<div class="row"><span><b>${esc(x.title)}</b><small>${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name||'Автопарк')} · ${x.date?fmtDate(x.date):'За пробігом'}${x.km!=null?' · '+num(x.km)+' км':''}</small></span><button class="smallbtn" onclick="${x.source==='document'?`documentForm('${x.id}')`:x.source==='service'?`detail('${x.vehicleId}')`:`eventForm('${x.id}')`}">Відкрити</button></div>`).join('')||'<div class="empty-inline">Немає подій</div>'}</div>`}).join('')}`)}
function eventForm(id){let x=d.events.find(x=>x.id===id)||{};page('Планування події','Нагадування відображаються в програмі',`<div class="card">${field('Назва',input('evTitle',x.title))}${field('Автомобіль',`<select id="evVehicle">${vehicleSelect(x.vehicleId)}</select>`)}${field('Дата',input('evDate',x.date,'date'))}${field('Плановий пробіг, км',input('evKm',x.km,'number'))}${field('Примітка',`<textarea id="evNote">${esc(x.note)}</textarea>`)}<button class="btn" onclick="saveEvent('${id||''}')">Зберегти</button>${id?`<button class="btn2 danger-btn" onclick="removeItem('events','${id}');calendarPage()">Видалити подію</button>`:''}</div>`)}
function saveEvent(id){let title=$('#evTitle').value.trim(),date=$('#evDate').value,km=$('#evKm').value;if(!title||(!date&&!km))return alert('Вкажіть назву та дату або пробіг');let x={id:id||'ev'+Date.now(),title,date,km:km===''?null:+km,vehicleId:$('#evVehicle').value,note:$('#evNote').value};let old=d.events.find(y=>y.id===id);if(old)Object.assign(old,x);else d.events.push(x);save();calendarPage()}
function removeItem(key,id){if(confirm('Видалити запис? Він залишиться у попередніх хмарних версіях даних.')){d[key]=d[key].filter(x=>x.id!==id);save()}}
const faultStatuses=['Нова проблема','На діагностиці','Очікує ремонту','Вирішена','Повторна поява'];
function breakdownsPage(){page('Журнал поломок','Історія симптомів, діагностики та вирішених проблем',`<button class="btn" onclick="faultForm()">＋ Записати проблему</button>${d.breakdowns.map(x=>`<article class="card" data-vehicle="${x.vehicleId}"><span class="status ${x.status==='Вирішена'?'ok':'warn'}">${esc(x.status)}</span><h3 style="margin-top:16px">${esc(x.title)}</h3><p class="tiny">${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name)} · ${fmtDate(x.date)} · ${num(x.km)} км</p><p>${esc(x.symptoms)}</p>${x.repair?`<p class="tiny">Ремонт: ${esc(x.repair)} · ${cash(x.cost)}</p>`:''}<button class="btn2" onclick="faultForm('${x.id}')">Відкрити історію проблеми</button></article>`).join('')||'<div class="card empty">Проблем поки немає. Записуйте навіть короткочасні симптоми — це допоможе під час діагностики.</div>'}`)}
function faultForm(id){let x=d.breakdowns.find(x=>x.id===id)||{};page(id?'Історія проблеми':'Нова проблема','Після вирішення запис зберігається в журналі',`<div class="card">${field('Автомобіль',`<select id="fVehicle">${vehicleSelect(x.vehicleId)}</select>`)}${field('Назва проблеми',input('fTitle',x.title))}<div class="split-fields">${field('Дата появи',input('fDate',x.date||today(),'date'))}${field('Пробіг',input('fKm',x.km,'number'))}</div>${field('Статус',`<select id="fStatus">${faultStatuses.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select>`)}${[['Симптоми','symptoms'],['Умови виникнення','conditions'],['Можлива причина','cause'],['Діагностика','diagnosis'],['Виконаний ремонт','repair']].map(([l,k])=>field(l,`<textarea id="f_${k}">${esc(x[k])}</textarea>`)).join('')}${field('Вартість усунення, ₴',input('fCost',x.cost,'number'))}<div class="note">Для включення ремонту в аналітику додайте витрату в історію обслуговування. Це запобігає подвійному обліку.</div>${attachmentForm(x)}<button class="btn" onclick="saveFault('${id||''}').catch(e=>alert(e.message))">Зберегти</button>${id?`<button class="btn2 danger-btn" onclick="removeItem('breakdowns','${id}');breakdownsPage()">Видалити проблему</button>`:''}</div>`)}
async function saveFault(id){let title=$('#fTitle').value.trim(),vehicleId=$('#fVehicle').value,km=$('#fKm').value,cost=$('#fCost').value;if(!title||!vehicleId||+km<0||+cost<0)return alert('Перевірте назву, автомобіль, пробіг і вартість');let old=d.breakdowns.find(x=>x.id===id),x={id:id||'fault'+Date.now(),title,vehicleId,date:$('#fDate').value,km:km===''?null:+km,status:$('#fStatus').value,cost:cost===''?null:+cost,attachments:await readAttachments(old?.attachments||[])};for(let k of ['symptoms','conditions','cause','diagnosis','repair'])x[k]=$('#f_'+k).value;if(old)Object.assign(old,x);else d.breakdowns.push(x);save();breakdownsPage()}
function budgetPage(){page('Бюджет','Плануйте витрати та порівнюйте з фактом',`<button class="btn" onclick="budgetForm()">＋ Запланувати бюджет</button>${d.budgets.map(x=>{let a=expenses().filter(r=>(!x.vehicleId||r.vehicleId===x.vehicleId)&&r.date?.startsWith(x.period)&&(x.category==='Усі'||r.category===x.category)),actual=a.reduce((s,r)=>s+r.total,0),left=x.amount-actual;return `<div class="card"><div class="head"><h3>${esc(x.period)} · ${esc(x.category)}</h3><button class="smallbtn" onclick="budgetForm('${x.id}')">Змінити</button></div><p class="tiny">${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name||'Увесь автопарк')}</p><div class="budget-track"><span style="width:${Math.min(100,actual/x.amount*100)}%"></span></div><div class="row"><span>Заплановано</span><b>${cash(x.amount)}</b></div><div class="row"><span>Фактично</span><b>${cash(actual)}</b></div><div class="row"><span>${left<0?'Перевищення':'Залишок'}</span><b class="${left<0?'danger-text':''}">${cash(Math.abs(left))}</b></div></div>`}).join('')||'<div class="card empty">Створіть місячний або річний бюджет для авто чи всього автопарку.</div>'}`)}
function budgetForm(id){let x=d.budgets.find(x=>x.id===id)||{};page('Планування бюджету','Рік: 2026. Місяць: 2026-11.',`<div class="card">${field('Автомобіль',`<select id="bVehicle"><option value="">Увесь автопарк</option>${vehicleSelect(x.vehicleId)}</select>`)}${field('Період: РРРР або РРРР-ММ',input('bPeriod',x.period||today().slice(0,7)))}${field('Категорія',`<select id="bCategory">${['Усі','Пальне','Технічне обслуговування','Ремонт','Запчастини','Страхування / документи','Податки / платежі','Інше'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select>`)}${field('Планова сума, ₴',input('bAmount',x.amount,'number'))}<button class="btn" onclick="saveBudget('${id||''}')">Зберегти бюджет</button>${id?`<button class="btn2 danger-btn" onclick="removeItem('budgets','${id}');budgetPage()">Видалити</button>`:''}</div>`)}
function saveBudget(id){let period=$('#bPeriod').value,amount=+$('#bAmount').value;if(!/^\d{4}(-(?:0[1-9]|1[0-2]))?$/.test(period)||amount<=0)return alert('Перевірте формат періоду та суму');let x={id:id||'budget'+Date.now(),period,amount,vehicleId:$('#bVehicle').value,category:$('#bCategory').value},old=d.budgets.find(x=>x.id===id);if(old)Object.assign(old,x);else d.budgets.push(x);save();budgetPage()}
function expenses(){return [...d.carRecords.map(x=>({...x,title:x.work,category:x.kind||'Інше',total:+x.cost||0})),...d.fuelups.map(x=>({...x,title:'Заправка '+fuelLabel(x.type),category:'Пальне',total:+x.total||0}))]}
function ownershipPage(){page('Вартість володіння','Придбання, експлуатація та повернуті кошти від продажу',`${d.vehicles.map(v=>{let total=expenses().filter(x=>x.vehicleId===v.id).reduce((s,x)=>s+x.total,0),bought=v.purchasePrice!=null&&v.purchasePrice!=='',sold=v.salePrice!=null&&v.salePrice!=='',sum=total+(bought?+v.purchasePrice:0)-(sold?+v.salePrice:0),dist=v.purchaseKm!==''&&v.purchaseKm!=null?+v.km - +v.purchaseKm:null,months=v.purchaseDate?Math.max(1,(new Date().getFullYear()-new Date(v.purchaseDate).getFullYear())*12+new Date().getMonth()-new Date(v.purchaseDate).getMonth()+1):null;return `<div class="card"><h3>${esc(v.name)}</h3><div class="row"><span>Експлуатаційні витрати</span><b>${cash(total)}</b></div><div class="row"><span>Придбання</span><b>${bought?cash(v.purchasePrice):'Не вказано'}</b></div><div class="row"><span>Отримано від продажу</span><b>${sold?cash(v.salePrice):'Не вказано'}</b></div><div class="row"><span>Вартість володіння${bought?'':' · неповна'}</span><b>${cash(sum)}</b></div><div class="row"><span>За місяць</span><b>${months?cash(sum/months):'Потрібна дата придбання'}</b></div><div class="row"><span>За 1 км / 100 км</span><b>${dist>0?cash(sum/dist)+' / '+cash(sum/dist*100):'Потрібен пробіг придбання'}</b></div><p class="tiny">Розрахунок за внесеними даними; відсутні витрати не враховані.</p><button class="btn2" onclick="vehicleForm('${v.id}')">Доповнити дані</button></div>`}).join('')||'<div class="empty">Додайте автомобіль.</div>'}`)}
function attachmentForm(x){return `${(x.attachments||[]).map((a,i)=>`<div class="row"><button class="muted-link" onclick="viewAttachment('${x.id}',${i})">${esc(a.name||'Вкладення '+(i+1))}</button><label class="tiny"><input type="checkbox" name="removeAttachment" value="${i}"> Видалити</label></div>`).join('')}${field('Фото або PDF (до 4 МБ загалом на запис)',`<input id="attachments" type="file" accept="image/*,application/pdf" multiple>`)}<p class="tiny">На iPhone оберіть фото з галереї або камеру. Зображення стискаються автоматично.</p>`}
async function readAttachments(previous){let remove=[...document.querySelectorAll('[name="removeAttachment"]:checked')].map(x=>+x.value),a=previous.filter((_,i)=>!remove.includes(i));for(let file of $('#attachments')?.files||[]){if(!file.type.startsWith('image/')&&file.type!=='application/pdf')throw Error('Дозволено лише фото та PDF');let data=file.type.startsWith('image/')?await compressPhoto(file,1400,.72):await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});a.push({name:file.name,data})}if(JSON.stringify(a).length>4000000)throw Error('Вкладення завеликі. Оберіть менші файли.');return a}
function viewAttachment(id,i){let x=[...d.documents,...d.carRecords,...d.breakdowns].find(x=>x.id===id),a=x?.attachments?.[i];if(!a)return;let [meta,base]=a.data.split(','),raw=atob(base),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:meta.slice(5).split(';')[0]}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
function documentForm(id){let x=d.documents.find(z=>z.id===id)||{};page(id?'Редагувати документ':'Новий документ','Нагадування за 30, 14 та 3 дні відображаються всередині програми',`<div class="card">${field('Автомобіль',`<select id="docVehicle">${vehicleSelect(x.vehicleId)}</select>`)}${field('Назва документа',input('docTitle',x.title))}${field('Тип',input('docType',x.type))}<div class="split-fields">${field('Дата видачі',input('docIssued',x.issueDate,'date'))}${field('Дійсний до',input('docDate',x.expiryDate,'date'))}</div>${field('Додатковий горизонт нагадування, днів',input('docDays',x.remindDays??30,'number'))}${field('Примітка',`<textarea id="docNote">${esc(x.note)}</textarea>`)}${attachmentForm(x)}<button class="btn" onclick="saveDocument('${id||''}').catch(e=>alert(e.message))">Зберегти документ</button></div>`)}
async function saveDocument(id){let vehicleId=$('#docVehicle').value,title=$('#docTitle').value.trim(),expiryDate=$('#docDate').value,remindDays=+$('#docDays').value;if(!vehicleId||!title||remindDays<0)return alert('Перевірте авто, назву та дні нагадування');let old=d.documents.find(x=>x.id===id),obj={vehicleId,title,expiryDate,remindDays,type:$('#docType').value,issueDate:$('#docIssued').value,note:$('#docNote').value,attachments:await readAttachments(old?.attachments||[])};if(old)Object.assign(old,obj);else d.documents.push({id:'doc'+Date.now(),...obj});save();documentsPage()}
function reportPage(){page('Звіт для друку та PDF','Оберіть автомобіль і період. У діалозі друку оберіть «Зберегти як PDF».',`<div class="card">${field('Автомобіль',`<select id="reportVehicle"><option value="">Увесь автопарк</option>${vehicleSelect()}</select>`)}<div class="split-fields">${field('Від',input('reportFrom','','date'))}${field('До',input('reportTo',today(),'date'))}</div><label class="tiny"><input type="checkbox" id="reportPhotos"> Додати фотографії</label><button class="btn" onclick="printReport()">Сформувати звіт</button></div>`)}
function printReport(){let id=$('#reportVehicle').value,from=$('#reportFrom').value||'0000',to=$('#reportTo').value||'9999',photos=$('#reportPhotos').checked;if(from>to)return alert('Перевірте період');let a=expenses().filter(x=>(!id||x.vehicleId===id)&&x.date>=from&&x.date<=to),w=window.open('','_blank');if(!w)return alert('Дозвольте відкриття вікна для звіту');w.document.write(`<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>MY GARAGE v8 — звіт</title><style>body{font:14px sans-serif;color:#202820;margin:36px}h1{font-size:28px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ccc;padding:10px}img{max-width:240px;max-height:160px}button{padding:12px}@media print{button{display:none}tr{break-inside:avoid}}</style><link rel="stylesheet" href="/v7.css"></head><body><button onclick="window.print()">Друк / Зберегти як PDF</button><h1>MY GARAGE v8 · Історія автомобіля</h1><p>${from==='0000'?'Від початку':fmtDate(from)} — ${fmtDate(to)}</p>${d.vehicles.filter(v=>!id||v.id===id).map(v=>`<h2>${esc(v.name)}</h2><p>${esc(v.year||'')} · ${esc(v.plate||'')} · VIN ${esc(v.vin||'не вказано')} · ${num(v.km)} км</p>${photos&&v.photo?`<img src="${esc(v.photo)}" alt="Автомобіль">`:''}`).join('')}<h2>Внесені витрати: ${cash(a.reduce((s,x)=>s+x.total,0))}</h2><p>Суми відображають лише внесені записи. Пропущені дані не оцінюються.</p><table><thead><tr><th>Дата</th><th>Автомобіль / запис</th><th>Пробіг</th><th>Вартість</th></tr></thead><tbody>${a.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name)}<br>${esc(x.title)}<br>${esc(x.note||'')}${photos&&x.photo?`<br><img src="${esc(x.photo)}">`:''}${photos?(x.attachments||[]).filter(a=>a.data?.startsWith('data:image/')).map(a=>`<br><img src="${esc(a.data)}">`).join(''):''}</td><td>${num(x.km)} км</td><td>${cash(x.total)}</td></tr>`).join('')}</tbody></table><p>Сформовано ${fmtDate(today())} · MY GARAGE v8.0</p></body></html>`);w.document.close()}
const serviceCategories=['Двигун','Коробка передач','Ходова частина','Гальмівна система','Електрика','Система охолодження','Паливна система','ГБО','Кузов','Інше'];
function vehicleForm(id){v6VehicleForm(id);let v=d.vehicles.find(x=>x.id===id)||{};$('#vn2').closest('.field').insertAdjacentHTML('beforebegin',`${field('Марка',input('vBrand',v.brand))}${field('Модель',input('vModel',v.model))}${field('Коробка передач',input('vTransmission',v.transmission))}<div class="split-fields">${field('Дата придбання',input('vPurchaseDate',v.purchaseDate,'date'))}${field('Пробіг придбання, км',input('vPurchaseKm',v.purchaseKm,'number'))}</div><div class="split-fields">${field('Ціна придбання, ₴',input('vPurchasePrice',v.purchasePrice,'number'))}${field('Ціна продажу, ₴',input('vSalePrice',v.salePrice,'number'))}</div>`)}
function recordForm(id,rules,v,r={}){let html=v6RecordForm(id,rules,v,r);return html.replace('<button class="btn" onclick="saveRecord',`${field('Категорія робіт',`<select id="rCategory">${serviceCategories.map(k=>`<option ${r.category===k?'selected':''}>${k}</option>`).join('')}</select>`)}<div class="split-fields">${field('Вартість запчастин, ₴',`<input id="rPartsCost" type="number" min="0" step=".01" value="${r.partsCost??''}" oninput="updateRecordTotal()">`)}${field('Вартість роботи, ₴',`<input id="rLaborCost" type="number" min="0" step=".01" value="${r.laborCost??''}" oninput="updateRecordTotal()">`)}</div>${field('Виконавець / СТО',input('rProvider',r.provider))}${attachmentForm(r)}<button class="btn" onclick="saveRecord`).replace(`saveRecord('${id}','${r.id||''}')`,`saveRecord('${id}','${r.id||''}').catch(e=>alert(e.message))`)}

function fuelLogForm(id){v6FuelLogForm(id);if($('#flFull'))$('#flFull').closest('label').insertAdjacentHTML('beforebegin',`${field('Назва АЗС',input('flStation'))}${field('Примітка',input('flNote'))}`)}
function detail(id){v6Detail(id);let v=d.vehicles.find(x=>x.id===id);if(!v)return;let heading=$('.page-heading');heading.insertAdjacentHTML('afterend',`<div class="profile-nav"><button onclick="profileSection('general')">Загальне</button><button onclick="profileSection('service')">Обслуговування</button><button onclick="fuelLogList('${id}')">Заправки</button><button onclick="profileExpenses('${id}')">Витрати</button><button onclick="profileDocuments('${id}')">Документи</button><button onclick="profileFaults('${id}')">Поломки</button><button onclick="profileAnalytics('${id}')">Аналітика</button><button onclick="profileCalendar('${id}')">Календар</button></div>`);let hero=$('.hero');if(hero)hero.insertAdjacentHTML('beforeend',`<p class="tiny">${[v.brand,v.model,v.engine,v.transmission,fuelLabel(v.fuelType)].filter(Boolean).map(esc).join(' · ')}</p><p class="tiny">${v.purchaseDate?'Придбано: '+fmtDate(v.purchaseDate):''}${v.purchaseKm!=null?' · '+num(v.purchaseKm)+' км':''}</p>`);let history=$('.head');$('#v').insertAdjacentHTML('beforeend',`<div class="card"><h3>Історія за категоріями</h3><select id="historyCategory" onchange="renderCategoryHistory('${id}')"><option value="">Усі категорії</option>${serviceCategories.map(k=>`<option>${k}</option>`).join('')}</select><div id="categoryHistory"></div></div>`);renderCategoryHistory(id)}
function profileSection(section){let target=section==='general'?$('.hero'):[...document.querySelectorAll('.card')].find(x=>x.textContent.includes('Контроль ТО'));target?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderCategoryHistory(id){let category=$('#historyCategory').value,rows=d.carRecords.filter(x=>x.vehicleId===id&&(!category||(x.category||'Інше')===category)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(+b.km)-(+a.km)),groups={};for(let r of rows){let month=(r.date||'Без дати').slice(0,7);(groups[month]||=[]).push(r)}$('#categoryHistory').innerHTML=Object.entries(groups).map(([month,records])=>`<details class="archive"><summary><b>${esc(month)}</b><span class="tiny">${records.length} записів</span></summary><div class="archive-body">${records.map(r=>`<div class="record"><span><b>${esc(r.work)}</b><small class="tiny">${fmtDate(r.date)} · ${num(r.km)} км · ${esc(r.category||'Інше')}<br>${esc(r.provider||'')}</small>${(r.attachments||[]).map((a,i)=>`<button class="muted-link" onclick="viewAttachment('${r.id}',${i})">${esc(a.name)}</button>`).join('')}<button class="muted-link" onclick="editRecord('${id}','${r.id}')">Відкрити</button></span><b>${cash(r.cost)}</b></div>`).join('')}</div></details>`).join('')||'<div class="empty">Записів у категорії ще немає.</div>'}
function profileExpenses(id){page('Витрати автомобіля',esc(d.vehicles.find(v=>v.id===id)?.name),`${expenses().filter(x=>x.vehicleId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><small>${fmtDate(x.date)} · ${esc(x.category)}</small></span><b>${cash(x.total)}</b></div>`).join('')||'<div class="empty">Витрат ще немає.</div>'}`)}

function profileAnalytics(id){analyticsPage();$('#anVehicle').value=id;renderAnalytics()}
function profileCalendar(id){page('Календар автомобіля',esc(d.vehicles.find(v=>v.id===id)?.name),`<button class="btn" onclick="eventForm();$('#evVehicle').value='${id}'">＋ Подія</button>${dueItems().filter(x=>x.v.id===id).map(x=>`<div class="row"><span><b>${esc(x.r.name)}</b><small>${x.date?fmtDate(x.date):'Без дати'}</small></span><b>${x.km===null?'Потрібен запис':num(x.km)+' км'}</b></div>`).join('')}${d.events.filter(x=>x.vehicleId===id).map(x=>`<div class="row"><span>${esc(x.title)}<small>${fmtDate(x.date)}</small></span><button class="smallbtn" onclick="eventForm('${x.id}')">Змінити</button></div>`).join('')}`)}
function documentsPage(){let a=d.documents.slice().sort((x,y)=>(x.expiryDate||'9999').localeCompare(y.expiryDate||'9999'));page('Документи та нагадування','Страхування, техогляд та документи автомобіля',`<button class="btn" onclick="documentForm()">＋ Додати документ</button>${a.map(x=>{let days=x.expiryDate?Math.ceil((new Date(x.expiryDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null;return `<div class="card" data-vehicle="${x.vehicleId}"><div class="row"><span><b>${esc(x.title)}</b><small>${esc(d.vehicles.find(v=>v.id===x.vehicleId)?.name)} · ${esc(x.type||'Документ')}</small></span><span class="status ${days!==null&&days<0?'bad':days!==null&&days<=30?'warn':'ok'}">${days===null?'Без строку':days<0?'Прострочено':days===0?'Сьогодні':days+' дн.'}</span></div><p class="tiny">${x.issueDate?'Видано '+fmtDate(x.issueDate)+' · ':''}${x.expiryDate?'Діє до '+fmtDate(x.expiryDate):'Без дати завершення'}<br>${esc(x.note||'')}</p>${(x.attachments||[]).map((a,i)=>`<button class="muted-link" onclick="viewAttachment('${x.id}',${i})">${esc(a.name)}</button>`).join('')}<div><button class="smallbtn" onclick="documentForm('${x.id}')">Редагувати</button> <button class="smallbtn danger-btn" onclick="deleteDocument('${x.id}')">Видалити</button></div></div>`}).join('')||'<div class="card empty">Документів ще немає.</div>'}`)}

function validateBackup(x){const visit=(value,key='')=>{if(value&&typeof value==='object'){for(let [k,v]of Object.entries(value)){if(['__proto__','constructor','prototype','__mgAttachment'].includes(k))throw Error('Небезпечна структура файлу');visit(v,k)}}else if(typeof value==='string'){if(['km','year','purchaseKm','purchasePrice','salePrice','cost','qty','price','total','partsCost','laborCost','kmInterval','monthInterval','alertKm','alertMonths','remindDays'].includes(key)&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0))throw Error('Некоректне числове поле '+key);if(key==='vehicleId'&&value&&!/^[\w-]+$/.test(value))throw Error('Некоректний ідентифікатор авто');if(key==='photo'||key==='data'){if(value&&!/^data:(image\/(jpeg|png|webp|gif)|application\/pdf);base64,[A-Za-z0-9+/=\s]+$/.test(value)&&!/^https?:\/\//.test(value))throw Error('Некоректне фото або вкладення');}if(['date','expiryDate','purchaseDate','issueDate'].includes(key)&&value&&!/^\d{4}-\d{2}-\d{2}$/.test(value))throw Error('Некоректна дата');} };visit(x);}
function distanceForFleet(records,vid='all'){let total=0;const ids=[...new Set(records.map(x=>x.vehicleId))];for(let id of ids){if(vid!=='all'&&id!==vid)continue;let a=records.filter(x=>x.vehicleId===id&&x.km!==''&&x.km!=null&&Number.isFinite(+x.km)).map(x=>+x.km);if(a.length<2||Math.max(...a)<=Math.min(...a))return 0;total+=Math.max(...a)-Math.min(...a)}return total;}
function fuelStats(id){const all=fuelConsumption(id);return `<div class="card"><h3>Середня витрата за повними інтервалами</h3>${[['Місяць',today().slice(0,7)],['Рік',today().slice(0,4)]].map(([label,period])=>['petrol','diesel','lpg','electric'].map(type=>{let a=all.filter(x=>x.type===type&&x.date.startsWith(period));if(!a.length)return '';let dist=a.reduce((s,x)=>s+x.dist,0),qty=a.reduce((s,x)=>s+x.liters,0);return `<div class="row"><span>${label} · ${fuelLabel(type)}<small>${num(dist)} км у завершених інтервалах</small></span><b>${(qty/dist*100).toFixed(2)} ${type==='electric'?'кВт·год':'л'}/100 км</b></div>`}).join('')).join('')||'<p class="tiny">Для кожного виду пального потрібні дві повні заправки з різним пробігом. Неповні заправки між ними враховуються.</p>'}<p class="tiny">Інтервали віднесено до періоду завершення. Для ГБО показники газу та бензину окремі; вони не визначають, яку частину шляху пройдено на кожному пальному.</p></div>`;}
function updateFuelTotal(){let q=$('#flQty'),p=$('#flPrice'),t=$('#flTotal');if(q&&p&&t)t.value=+q.value>0&&+p.value>0?(+q.value * +p.value).toFixed(2):'';}
function renderAnalytics(){v6RenderAnalytics();let root=$('#anResult');if(!root)return;let vid=$('#anVehicle').value,period=$('#anPeriod').value,from=period==='month'?today().slice(0,7)+'-01':period==='year'?today().slice(0,4)+'-01-01':period==='custom'?$('#anFrom').value:'0000',to=period==='custom'?$('#anTo').value:period==='all'?'9999':today();if(from>to)return;let a=expenses().filter(x=>(vid==='all'||x.vehicleId===vid)&&x.date>=from&&x.date<=to),ids=[...new Set(a.map(x=>x.vehicleId))],missing=ids.filter(id=>{let values=a.filter(x=>x.vehicleId===id&&x.km!=null&&x.km!==''&&Number.isFinite(+x.km)).map(x=>+x.km);return values.length<2||Math.max(...values)<=Math.min(...values)});root.insertAdjacentHTML('beforeend',`${missing.length?`<div class="note">Недостатньо даних пробігу: ${missing.map(id=>esc(d.vehicles.find(v=>v.id===id)?.name||id)).join(', ')}. Додайте початковий та кінцевий пробіг у записах вибраного періоду.</div>`:''}<details class="card"><summary><b>Порівняння автомобілів</b><span>＋</span></summary>${d.vehicles.filter(v=>vid==='all'||v.id===vid).map(v=>{let total=a.filter(x=>x.vehicleId===v.id).reduce((s,x)=>s+x.total,0),distance=distanceForFleet(a.filter(x=>x.vehicleId===v.id));return `<div class="row"><span>${esc(v.name)}<small>${distance?num(distance)+' км · '+cash(total/distance)+' / км':'Недостатньо даних пробігу'}</small></span><b>${cash(total)}</b></div>`}).join('')}</details><details class="card"><summary><b>Порівняння років</b><span>＋</span></summary>${[...new Set(expenses().filter(x=>vid==='all'||x.vehicleId===vid).map(x=>x.date?.slice(0,4)).filter(Boolean))].sort().reverse().map(year=>`<div class="row"><span>${esc(year)}</span><b>${cash(expenses().filter(x=>(vid==='all'||x.vehicleId===vid)&&x.date?.startsWith(year)).reduce((s,x)=>s+x.total,0))}</b></div>`).join('')||'<p class="tiny">Записів ще немає.</p>'}<p class="tiny">Порівняння охоплює всі наявні записи за кожен рік.</p></details>`);}
function fuelCalculator(){v6FuelCalculator();let result=$('#fcResult');if(result)result.insertAdjacentHTML('afterend',`<details class="card"><summary><b>Порівняти ГБО з бензином</b><span>＋</span></summary><p class="tiny">Заповніть газ, бензин у русі, запуск і прогрів у калькуляторі вище.</p>${field('Витрата тільки на бензині, л/100 км',input('petrolOnlyUse','','number'))}<button class="btn2" onclick="compareLpg()">Порівняти вартість</button><div id="lpgCompare"></div></details>`)}
function compareLpg(){if($('#fcType').value!=='petrol_lpg')return alert('Оберіть «Бензин + газ» у калькуляторі');let dist=+$('#fcDistance').value,gas=+$('#fcUseGas').value,gp=+$('#fcGasPrice').value,petrol=$('#fcPetrol').value,warm=$('#fcWarmup').value,pp=+$('#fcPetrolPrice').value,only=+$('#petrolOnlyUse').value;if(!(dist>0&&gas>0&&gp>0&&pp>0&&only>0)||petrol===''||warm===''||+petrol<0||+warm<0)return alert('Заповніть усі витрати та ціни. Якщо бензин на прогрів не витрачається, вкажіть 0.');let lpg=dist/100*(gas*gp + +petrol*pp)+ +warm*pp,petrolCost=dist/100*only*pp;$('#lpgCompare').innerHTML=`<div class="row"><span>Газ + бензин на рух, запуск та прогрів</span><b>${cash(lpg)}</b></div><div class="row"><span>Лише бензин</span><b>${cash(petrolCost)}</b></div><div class="row"><span>Різниця за поїздку</span><b>${cash(petrolCost-lpg)}</b></div><p class="tiny">Орієнтовний розрахунок за введеними значеннями.</p>`;}
function dashboardReminders(){let a=dueItems().filter(x=>x.overdue||x.soon);for(let doc of d.documents){if(!doc.expiryDate)continue;let days=Math.ceil((new Date(doc.expiryDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);if(days>Math.max(30,+doc.remindDays||0))continue;let v=d.vehicles.find(x=>x.id===doc.vehicleId);if(v)a.push({r:{name:doc.title},v,date:doc.expiryDate,km:null,days,overdue:days<0,soon:true,action:`documentForm('${doc.id}')`})}for(let ev of d.events){let v=d.vehicles.find(x=>x.id===ev.vehicleId),days=ev.date?Math.ceil((new Date(ev.date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null,km=ev.km!=null&&v?+ev.km- +v.km:null;if((days!==null&&days<=30)||(km!==null&&km<=500))a.push({r:{name:ev.title},v:v||{name:'Автопарк'},date:ev.date,km,days,overdue:(days!==null&&days<0)||(km!==null&&km<=0),soon:true,action:`eventForm('${ev.id}')`})}return a.sort((x,y)=>(y.overdue-x.overdue)||(x.days??Infinity)-(y.days??Infinity));}
// Blog v8: visibility is stored per post and enforced by the API for both text and media.
let blogDraftMedia=[];
async function blogPage(){page('Блог спільноти','Публічні дописи та ваш приватний простір',`<div class="row"><span class="tiny">Публічні записи доступні користувачам платформи. Приватні — лише автору.</span><button class="btn" onclick="blogForm()">＋ Новий допис</button></div><div id="blog-list" class="stack"><div class="empty">Завантаження…</div></div>`);try{let [pub,mine]=await Promise.all([fetch('/api/blog'),fetch('/api/blog?mine=1')]);if(!pub.ok||!mine.ok)throw Error('Не вдалося завантажити блог');let a=(await pub.json()).posts||[],b=(await mine.json()).posts||[],all=[...new Map([...a,...b].map(x=>[x.id,x])).values()].sort((x,y)=>y.updated_at-x.updated_at);$('#blog-list').innerHTML=all.map(x=>`<article class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="status ${x.visibility==='public'?'ok':'warn'}">${x.visibility==='public'?'Публічний':'Приватний'}</span></div><p>${esc(x.content).replace(/\n/g,'<br>')}</p>${(x.media||[]).map(m=>m.type?.startsWith('image/')?`<img src="/api/blog/${encodeURIComponent(x.id)}/media/${encodeURIComponent(m.key)}" alt="${esc(m.name)}" style="max-width:100%;border-radius:12px">`:`<a href="/api/blog/${encodeURIComponent(x.id)}/media/${encodeURIComponent(m.key)}" target="_blank" rel="noopener">${esc(m.name||'Вкладення')}</a>`).join('<br>')}<div class="row"><small class="tiny">${new Date(x.created_at).toLocaleDateString('uk-UA')}</small>${x.author_id===currentUser?.id?`<button class="smallbtn" onclick="blogForm('${x.id}')">Редагувати</button><button class="smallbtn danger-btn" onclick="deleteBlogPost('${x.id}')">Видалити</button>`:''}</div></article>`).join('')||'<div class="empty">Дописи ще не опубліковані.</div>'}catch(e){$('#blog-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function blogForm(id=''){let post=null;if(id){let r=await fetch('/api/blog?mine=1'),x=await r.json();post=(x.posts||[]).find(p=>p.id===id);if(!post)return blogPage()}blogDraftMedia=(post?.media||[]).slice();page(id?'Редагувати допис':'Новий допис','Кожен запис має власний рівень видимості',`<div class="card">${field('Заголовок',input('blogTitle',post?.title||''))}${field('Текст допису',`<textarea id="blogContent" rows="8" maxlength="50000" placeholder="Поділіться історією, порадою або досвідом…">${esc(post?.content||'')}</textarea>`)}${field('Хто побачить допис?',`<select id="blogVisibility"><option value="private" ${post?.visibility!=='public'?'selected':''}>Приватний — лише я</option><option value="public" ${post?.visibility==='public'?'selected':''}>Публічний — усі користувачі</option></select>`)}${field('Фото та PDF',`<input id="blogFiles" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple onchange="uploadBlogMedia(this)"><small class="tiny">До 20 файлів; завантаження до 3 МБ на файл.</small><div id="blogMediaList"></div>`)}<button class="btn" onclick="saveBlogPost('${id}')">Зберегти допис</button><button class="btn2" onclick="blogPage()">Скасувати</button></div>`);renderBlogMedia()}
function renderBlogMedia(){let el=$('#blogMediaList');if(el)el.innerHTML=blogDraftMedia.map((m,i)=>`<div class="row"><span class="tiny">${esc(m.name)}</span><button class="smallbtn danger-btn" onclick="blogDraftMedia.splice(${i},1);renderBlogMedia()">Прибрати</button></div>`).join('')||'<small class="tiny">Вкладень поки немає.</small>'}
async function uploadBlogMedia(input){for(const file of [...(input.files||[])]){if(file.size>3*1024*1024){alert(`${file.name}: файл більший за 3 МБ`);continue}if(blogDraftMedia.length>=20)break;let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let res=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'text/plain'},body:data});if(!res.ok){alert('Не вдалося завантажити '+file.name);continue}let ref=await res.json();blogDraftMedia.push({key:ref.__mgAttachment.split('/').pop(),name:file.name,type:file.type});renderBlogMedia()}input.value=''}
async function saveBlogPost(id){let title=$('#blogTitle').value.trim(),content=$('#blogContent').value,visibility=$('#blogVisibility').value;if(!title||!content.trim())return alert('Додайте заголовок і текст допису.');let payload={title,content,visibility,media:blogDraftMedia};let r=await fetch(id?'/api/blog/'+encodeURIComponent(id):'/api/blog',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let x=await r.json();if(!r.ok)return alert(x.error||'Не вдалося зберегти допис');toast('Допис збережено');blogPage()}
async function deleteBlogPost(id){if(!confirm('Видалити допис?'))return;let r=await fetch('/api/blog/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)return alert('Не вдалося видалити допис');blogPage()}

// Add platform navigation without changing the v6 record format.
const navItems=[['home','home','Головна'],['cars','car','Автомобілі'],['service','tool','Обслуговування'],['fuel','fuel','Паливо'],['analytics','chart','Аналітика']];
document.body.insertAdjacentHTML('beforeend',`<aside class="sidebar"><div class="sidebar-caption">ВАШ ПРОСТІР</div>${navItems.map(([tab,ic,label])=>`<button data-tab="${tab}" class="${tab==='home'?'active':''}" onclick="navigate('${tab}')">${icon(ic)}<span>${label}</span>${tab==='cars'?'<span class="nav-counter">Гараж</span>':''}</button>`).join('')}<div class="sidebar-divider"></div><div class="sidebar-caption">ІНСТРУМЕНТИ</div>${[['doc','Документи','documentsPage()'],['doc','Блог спільноти','blogPage()'],['calendar','Календар','calendarPage()'],['wallet','Бюджет','budgetPage()'],['tool','Журнал поломок','breakdownsPage()']].map(([ic,l,fn])=>`<button onclick="${fn}">${icon(ic)}<span>${l}</span></button>`).join('')}<div class="sidebar-bottom"><button onclick="backupPage()">${icon('shield')}<span>Резервні копії</span></button><button onclick="morePage()">${icon('more')}<span>Усі інструменти</span></button><div class="sidebar-footer"><span class="online-dot"></span><button id="sync-state" onclick="pending=true;if(ready)flushSave();else boot()">Підключення…</button><small>MY GARAGE · VERSION 8.0 DEV</small></div></div></aside><nav class="bottom-nav" aria-label="Основна навігація">${navItems.map(([tab,ic,l])=>`<button data-tab="${tab}" class="${tab==='home'?'active':''}" onclick="navigate('${tab}')">${icon(ic)}<span>${l}</span></button>`).join('')}</nav><footer class="app-footer">MY GARAGE <span>v8.0 DEV · Ваша історія. Ваш контроль.</span><button onclick="morePage()">Усі інструменти ↗</button></footer>`);
boot();
