name = "my-garage-v8"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "my-garage-v8"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "my-garage-v8-media"

[vars]
APP_ORIGIN = "https://REPLACE_WITH_YOUR_DOMAIN"
EMAIL_FROM = "MY GARAGE <login@REPLACE_WITH_VERIFIED_DOMAIN>"
